<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client Diary</title>
<meta name="description" content="Client Diary — дневник за работа с клиенти: карти, график, посещения и доход. Android, без интернет.">
<link rel="icon" type="image/png" href="assets/favicon.png">
<style>
  :root {
    --bg: #070b16;
    --surface: #0f1626;
    --surface-2: #151e33;
    --text: #e8ecf6;
    --muted: #9aa6c0;
    --accent: #2f7dff;
    --accent-2: #63a4ff;
    --line: #22304d;
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(1200px 600px at 85% -10%, rgba(47, 125, 255, .22), transparent 60%),
      radial-gradient(900px 500px at -10% 30%, rgba(47, 125, 255, .12), transparent 60%),
      var(--bg);
    color: var(--text);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  }
  a { color: var(--accent-2); }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
  header.top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 0; gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; }
  .brand img { width: 32px; height: 32px; border-radius: 8px; }
  .langs { display: flex; gap: 4px; flex-wrap: wrap; }
  .langs button {
    background: transparent; color: var(--muted); border: 1px solid var(--line);
    border-radius: 999px; padding: 4px 10px; font: inherit; font-size: 14px; cursor: pointer;
  }
  .langs button[aria-pressed="true"] { color: var(--text); border-color: var(--accent); background: rgba(47,125,255,.15); }

  .hero {
    display: grid; grid-template-columns: 1.1fr .9fr; gap: 40px; align-items: center;
    padding: 40px 0 56px;
  }
  .hero-icon { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 12px 40px rgba(47,125,255,.35); }
  h1 { font-size: clamp(34px, 6vw, 52px); line-height: 1.1; margin: 20px 0 12px; letter-spacing: -.02em; }
  .lead { font-size: 19px; color: var(--muted); margin: 0 0 28px; max-width: 34em; }
  .cta { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .btn {
    display: inline-flex; align-items: center; gap: 10px;
    background: linear-gradient(180deg, var(--accent-2), var(--accent));
    color: #fff; text-decoration: none; font-weight: 700; font-size: 17px;
    padding: 14px 24px; border-radius: 14px;
    box-shadow: 0 8px 24px rgba(47,125,255,.35);
  }
  .btn:hover { filter: brightness(1.07); }
  .btn svg { width: 22px; height: 22px; }
  .meta { color: var(--muted); font-size: 14px; }
  .hero-shot { justify-self: center; }

  .phone {
    width: 100%; max-width: 270px; border-radius: 28px; padding: 8px;
    background: #05070d; border: 1px solid var(--line);
    box-shadow: 0 30px 80px rgba(0,0,0,.55);
  }
  .phone img { display: block; width: 100%; border-radius: 21px; }

  section { padding: 48px 0; border-top: 1px solid var(--line); }
  h2 { font-size: 28px; margin: 0 0 24px; letter-spacing: -.01em; }
  .features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 20px;
  }
  .card .ico {
    width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
    background: rgba(47,125,255,.16); color: var(--accent-2); margin-bottom: 12px;
  }
  .card .ico svg { width: 22px; height: 22px; }
  .card h3 { margin: 0 0 6px; font-size: 17px; }
  .card p { margin: 0; color: var(--muted); font-size: 15px; }

  .shots {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
  }
  .shots figure { margin: 0; }
  .shots figcaption { color: var(--muted); font-size: 14px; text-align: center; margin-top: 10px; }

  .steps { counter-reset: step; display: grid; gap: 12px; padding: 0; margin: 0; list-style: none; }
  .steps li {
    counter-increment: step; position: relative; padding: 16px 16px 16px 60px;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  }
  .steps li::before {
    content: counter(step); position: absolute; left: 16px; top: 14px;
    width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
    background: var(--accent); color: #fff; font-weight: 700;
  }
  .note {
    margin-top: 16px; padding: 16px; border-radius: var(--radius);
    background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); font-size: 15px;
  }
  footer { padding: 32px 0 48px; color: var(--muted); font-size: 14px; border-top: 1px solid var(--line); }

  @media (max-width: 860px) {
    .hero { grid-template-columns: 1fr; gap: 32px; padding-top: 24px; }
    .features { grid-template-columns: 1fr 1fr; }
    .shots { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 520px) {
    .features { grid-template-columns: 1fr; }
    .shots { grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn { width: 100%; justify-content: center; }
  }
</style>
</head>

    document.querySelectorAll('[data-t]').forEach(el => { el.textContent = (t[el.dataset.t] || '').replace('{v}', version); });
    document.querySelectorAll('a[data-t="privacy"]').forEach(a => { a.href = 'privacy.html?lang=' + lang; });
    document.querySelectorAll('[data-alt]').forEach(el => { el.alt = t[el.dataset.alt] || ''; });
    // Screenshots of the app in the same language.
    document.querySelectorAll('[data-shot]').forEach(el => { el.src = 'assets/' + (T[lang] ? lang : 'bg') + '/' + el.dataset.shot + '.png'; });
    document.querySelectorAll('.langs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
    document.title = 'Client Diary — ' + t.title;
    try { localStorage.setItem('lang', lang); } catch (e) {}
  }
  document.querySelectorAll('.langs button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));

  let initial = 'bg';
  try {
    // ?lang=bg in the link wins, then the last choice, then the browser.
    const asked = new URLSearchParams(location.search).get('lang');
    const saved = (asked && T[asked]) ? asked : localStorage.getItem('lang');
    const browser = (navigator.language || 'bg').slice(0, 2);
    initial = saved || (T[browser] ? browser : 'bg');
  } catch (e) {}
  setLang(initial);

  // The current version from version.json, so a release updates one file.
  fetch('version.json', { cache: 'no-store' })
    .then(r => r.json())
    .then(j => { if (j.version) { version = j.version; setLang(document.documentElement.lang); } })
    .catch(() => {});
</script>
</body>
</html>
