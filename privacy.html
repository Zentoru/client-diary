<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client Diary — Privacy policy</title>
<meta name="description" content="Client Diary privacy policy: the app works offline and does not collect or share any data.">
<link rel="icon" type="image/png" href="assets/favicon.png">
<style>
  :root {
    --bg: #070b16;
    --surface: #0f1626;
    --text: #e8ecf6;
    --muted: #9aa6c0;
    --accent: #2f7dff;
    --accent-2: #63a4ff;
    --line: #22304d;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(1200px 600px at 85% -10%, rgba(47, 125, 255, .18), transparent 60%),
      var(--bg);
    color: var(--text);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  }
  a { color: var(--accent-2); }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }
  header.top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 0; gap: 12px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; color: var(--text); text-decoration: none; }
  .brand img { width: 32px; height: 32px; border-radius: 8px; }
  .langs { display: flex; gap: 4px; flex-wrap: wrap; }
  .langs button {
    background: transparent; color: var(--muted); border: 1px solid var(--line);
    border-radius: 999px; padding: 4px 10px; font: inherit; font-size: 14px; cursor: pointer;
  }
  .langs button[aria-pressed="true"] { color: var(--text); border-color: var(--accent); background: rgba(47,125,255,.15); }
  h1 { font-size: clamp(28px, 5vw, 40px); line-height: 1.15; margin: 24px 0 8px; letter-spacing: -.01em; }
  .date { color: var(--muted); margin: 0 0 24px; }
  .summary {
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    padding: 16px 20px; margin: 0 0 8px;
  }
  .summary p { margin: 0; }
  h2 { font-size: 20px; margin: 32px 0 8px; }
  ul { padding-left: 22px; }
  li { margin: 4px 0; }
  footer { padding: 32px 0 48px; margin-top: 40px; color: var(--muted); font-size: 14px; border-top: 1px solid var(--line); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="./"><img src="assets/favicon.png" alt="">Client Diary</a>
    <nav class="langs" aria-label="Language">
      <button data-lang="bg">BG</button>
      <button data-lang="ru">RU</button>
      <button data-lang="uk">UA</button>
      <button data-lang="en">EN</button>
    </nav>
  </header>
  <main id="policy"></main>
  <footer id="footer"></footer>
</div>

        ['Промени', '<p>Ако политиката се промени, новата версия ще се появи на тази страница с нова дата.</p>'],
        ['Контакти', '<p>Въпроси за поверителността: ' + mail + '.</p>']
      ],
      home: 'Начална страница'
    }
  };

  function setLang(lang) {
    const t = T[lang] || T.en;
    document.documentElement.lang = T[lang] ? lang : 'en';
    document.title = 'Client Diary — ' + t.title;
    let html = '<h1>' + t.title + '</h1><p class="date">' + t.date + '</p>' +
      '<div class="summary"><p>' + t.summary + '</p></div>';
    for (const [h, body] of t.sections) html += '<h2>' + h + '</h2>' + body;
    document.getElementById('policy').innerHTML = html;
    document.getElementById('footer').innerHTML =
      'Client Diary · Zentoru · <a href="./?lang=' + document.documentElement.lang + '">' + t.home + '</a>';
    document.querySelectorAll('.langs button').forEach(b =>
      b.setAttribute('aria-pressed', String(b.dataset.lang === document.documentElement.lang)));
    try { localStorage.setItem('lang', document.documentElement.lang); } catch (e) {}
  }

  document.querySelectorAll('.langs button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));

  (function () {
    // ?lang=ru from the app wins, then the last choice, then the browser.
    let saved = null;
    try { saved = localStorage.getItem('lang'); } catch (e) {}
    const asked = new URLSearchParams(location.search).get('lang');
    const browser = (navigator.language || 'en').slice(0, 2);
    const pick = [asked, saved, browser].find(l => l && T[l]) || 'en';
    setLang(pick);
  })();
</script>
</body>
</html>
